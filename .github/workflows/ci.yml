name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines floor and the current LTS.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check npm publishes package.json unchanged
        # npm silently rewrites an entry it considers invalid at publish time (0.2.0 lost
        # its "bin" this way), so fail when a dry run reports any auto-correction.
        run: |
          npm publish --dry-run --access public --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/publish-dry-run.log"
          if grep -q "auto-corrected" "$RUNNER_TEMP/publish-dry-run.log"; then
            echo "::error::npm would rewrite package.json when publishing; fix the entries listed above."
            exit 1
          fi
