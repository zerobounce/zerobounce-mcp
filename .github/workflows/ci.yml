name: CI

on:
  # Started by dependabot-auto-merge.yml after it merges: a merge made with GITHUB_TOKEN
  # starts no push workflows.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the superseded run; runs on main finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The engines floor (22), Maintenance LTS (24) and Active LTS (26, since 2026-10-28).
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate on what actually ships (the runtime dependencies). A devDependency advisory cannot
      # reach a consumer and must not block a merge; the full-tree audit below only reports.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Audit build toolchain (informational)
        continue-on-error: true
        run: npm audit --audit-level=low

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # dist/index.js is committed and is what npm ships: it must equal what the build produces.
      - name: Check the committed dist is current
        run: git diff --exit-code -- dist/index.js

      - name: Test
        run: npm test

      # Install the packed tarball into a clean directory, as a consumer would, and run it.
      # Dependencies come from the npm cache that `npm ci` filled, so this needs no network.
      - name: Install-test the packed tarball
        shell: bash
        run: |
          set -euo pipefail
          PACK_DIR=$(mktemp -d)
          CONSUMER=$(mktemp -d)
          npm pack --ignore-scripts --pack-destination "$PACK_DIR"
          TGZ=$(ls -1 "$PACK_DIR"/*.tgz)
          (cd "$CONSUMER" && npm init -y > /dev/null && npm install --ignore-scripts --no-audit --no-fund "$TGZ")
          WANT=$(node -p "require('./package.json').version")
          :
          GOT=$(node "$CONSUMER/node_modules/@zerobounce/mcp/dist/index.js" --version | tr -d '[:space:]')
          GOT=${GOT#v}
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::the installed package reports version '$GOT', expected '$WANT'."
            exit 1
          fi
          node "$CONSUMER/node_modules/@zerobounce/mcp/dist/index.js" --help | grep -q 'Usage: zerobounce-mcp'

      - name: Check npm publishes package.json unchanged
        # npm silently rewrites package.json entries it considers invalid at publish time,
        # so fail when a dry run reports any auto-correction. The dry run itself exits 1
        # once the version is on npm ("cannot publish over"), which is expected here, so
        # only its auto-correction warning is checked; npm prints it before that error.
        run: |
          npm publish --dry-run --access public --ignore-scripts > "$RUNNER_TEMP/publish-dry-run.log" 2>&1 || true
          cat "$RUNNER_TEMP/publish-dry-run.log"
          if grep -q "auto-corrected" "$RUNNER_TEMP/publish-dry-run.log"; then
            echo "::error::npm would rewrite package.json when publishing; fix the entries listed above."
            exit 1
          fi
